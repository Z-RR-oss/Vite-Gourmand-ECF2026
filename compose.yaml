# Développement local uniquement : identifiants fictifs, ports limités au loopback.
name: vite-gourmand
services:
  web:
    build: .
    ports:
      - "127.0.0.1:8088:80"
      - "127.0.0.1:8025:8025"
    environment:
      DB_HOST: db
      DB_NAME: vite_gourmand_test_docker
      DB_USER: vite_gourmand
      DB_PASSWORD: local-demo-only
      DB_TIMEZONE: Europe/Paris
      APP_URL: http://127.0.0.1:8088
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "1025"
      SMTP_AUTH: "false"
      SMTP_ENCRYPTION: none
      SMTP_FROM_EMAIL: demo@example.test
      CONTACT_EMAIL: contact@example.test
      FIREBASE_DATABASE_URL: ""
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/Public/assets/uploads
      - ./tests:/app/tests:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1/menus.php"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
  db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: vite_gourmand_test_docker
      MARIADB_USER: vite_gourmand
      MARIADB_PASSWORD: local-demo-only
      MARIADB_ROOT_PASSWORD: local-root-demo-only
      TZ: Europe/Paris
    volumes:
      - database:/var/lib/mysql
      - ./vite_gourmand.sql.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
  mail:
    image: axllent/mailpit:v1.29
    # PHPMailer n'autorise le SMTP sans TLS que sur loopback.
    # Mailpit partage donc le réseau de web, sans partager celui du Mac.
    network_mode: service:web
    depends_on:
      web:
        condition: service_started
volumes:
  database:
  uploads:
